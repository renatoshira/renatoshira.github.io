<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="slix-font.css">
<style>
html,body{margin:0}
body{width:1200px;height:630px;position:relative;overflow:hidden;background:#1b1a2e;color:#f2efe6;font-family:'Silkscreen',monospace}
.road{position:absolute;left:0;right:0;top:350px;height:280px;background:url(slix-scene.png) 62% 0/auto 340px repeat-x;image-rendering:pixelated}
.road:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#1b1a2e 0,rgba(27,26,46,0) 22%)}
.t{position:absolute;left:72px;top:58px}
h1{margin:0;font:900 150px/0.9 "Slix Display",'Silkscreen';letter-spacing:.02em;color:#f2efe6;text-shadow:8px 8px 0 #ff7a1a}
.s{margin-top:28px;font-size:25px;line-height:1.45;color:#f2efe6;max-width:640px}
.s b{color:#ffd23f;font-weight:700}
.pos{position:absolute;right:72px;top:64px;background:rgba(27,26,46,.85);border:4px solid #f2efe6;padding:14px 22px 16px;text-align:right}
.pos .l{font-size:16px;letter-spacing:.14em;opacity:.8}
.pos .n{font:900 84px/1 "Slix Display",'Silkscreen';color:#ff7a1a}
.pos .n small{font-size:36px;color:#f2efe6;opacity:.75}
.by{position:absolute;left:72px;bottom:40px;font-size:18px;letter-spacing:.06em;background:#1b1a2e;padding:8px 14px;border:3px solid #f2efe6}
.go{position:absolute;right:72px;bottom:40px;font:700 20px 'Silkscreen';letter-spacing:.12em;background:#ff7a1a;color:#1b1a2e;padding:10px 18px;border:3px solid #1b1a2e;box-shadow:0 0 0 3px #1fc8e0}
</style></head><body>
<div class="road"></div>
<div class="t">
<h1>SLIX</h1>
<div class="s">Um campeonato de <b>9 provas</b> e <b>100 carros</b>. Você larga em último, e a cada prova os últimos são eliminados.</div>
</div>
<div class="pos"><div class="l">POS</div><div class="n">100<small>/100</small></div></div>
<div class="by">Um jogo de Renato Shirakashi</div>
<div class="go">JOGAR NO NAVEGADOR</div>
</body></html>
